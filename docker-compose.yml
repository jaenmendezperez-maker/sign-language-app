services:
  db:
    image: postgres:17
    container_name: senas-db
    environment:
      POSTGRES_USER: senas
      POSTGRES_PASSWORD: senas_dev
      POSTGRES_DB: senas
    ports:
      - "5462:5432"   # 5462 en el equipo para no chocar con un PostgreSQL local
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: