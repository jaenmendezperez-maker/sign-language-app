<a class="skip-link" href="#contenido">Saltar al contenido</a>
<header class="topbar">
  <a class="brand" routerLink="/">SignLink</a>
  <nav aria-label="Principal">
    @if (auth.role() === 'MedicalStaff') {
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Traducir</a>
      <a routerLink="/consultas" routerLinkActive="active">Mis consultas</a>
    }
    @if (auth.role() === 'Administrator') {
      <a routerLink="/admin/registrar-sena" routerLinkActive="active">Registrar seña</a>
    }
    <a routerLink="/vocabulario" routerLinkActive="active">Vocabulario</a>
  </nav>
  <div class="user">
    @if (auth.user(); as u) {
      <span>{{ u.name }}</span>
      <button type="button" class="small" (click)="auth.logout()">Salir</button>
    } @else {
      <a routerLink="/login" routerLinkActive="active">Iniciar sesión</a>
    }
  </div>
</header>

<main class="container" id="contenido">
  <router-outlet />
</main>
